name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff — syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 .

  pipeline-smoke-test:
    name: Pipeline smoke test (national + geo, direct mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate datasets
        run: python scripts/generate_dataset.py

      - name: Run national pipeline (no LLM, no API key)
        run: python run.py --no-insights

      - name: Run national + geo pipeline (no LLM, no API key)
        run: python run.py --no-insights --geo

      - name: Verify expected outputs exist
        run: |
          test -f data/raw/mmm_weekly_ols_results.json
          test -f data/raw/mmm_weekly_budget_optimized.json
          test -f data/raw/mmm_weekly_geo_ols_results.json
          test -f data/raw/mmm_weekly_geo_budget_optimized.json
          python -c "import json; json.load(open('data/raw/mmm_weekly_ols_results.json'))"
          python -c "import json; json.load(open('data/raw/mmm_weekly_geo_ols_results.json'))"

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pharma-mmm-agent:ci .
